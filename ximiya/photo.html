  <title data-i18n="siteTitle">SCANNERI ELEMENTHO</title>
  <style>
    :root {
      --bg: #0c1222;
      --gold: #c9a227;
      --gold-l: #e8d48b;
      --teal: #2dd4bf;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --surf: rgba(20, 28, 46, .92);
      --border: rgba(201, 162, 39, .22);
      --cell: 44px;
      --gap: 3px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {

      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, .1);
      align-items: center
    }

    .nav a {
      color: var(--gold-l);
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .82rem;
      font-weight: 600
    }

    .nav a:hover,
    .nav a.active {
      background: rgba(201, 162, 39, .14);
      border-color: var(--gold)
    }

    .lang-bar {
      display: flex;
      gap: 4px;
      margin-left: 8px
    }

    .lang-bar .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer
    }

    .lang-bar .lang-btn:hover {
      color: var(--gold-l);
      border-color: var(--gold)
    }

    .lang-bar .lang-btn.active {
      color: #0c1222;
      background: linear-gradient(135deg, #c9a227, #a8841a);
      border-color: var(--gold)
    }

    .wrap {
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 12px 40px
    }

    h1 {
      text-align: center;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      color: var(--gold-l);
      margin: 8px 0 4px
    }

    .sub {
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 18px
    }

    .search {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .search input {
      flex: 1;
      min-width: 160px;
      max-width: 340px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, .35);
      color: var(--text);
      font-size: 1rem
    }

    .search input:focus {
      outline: none;
      border-color: var(--gold)
    }

    .search button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #c9a227, #a8841a);
      color: #0c1222;
      font-weight: 700;
      cursor: pointer;
      font-size: .95rem
    }

    .sel {
      display: none;
      background: var(--surf);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 16px;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap
    }

    .sel .sym {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--gold)
    }

    .sel-info h2 {
      font-size: 1.25rem;
      margin-bottom: 2px
    }

    .sel-info span {
      color: var(--muted);
      font-size: .85rem
    }

    .table-box {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-bottom: 16px
    }

    .table-title {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    #pt {
      display: grid;
      grid-template-columns: repeat(18, var(--cell));
      gap: var(--gap);
      justify-content: center;
      min-width: max-content;
      margin: 0 auto
    }

    .cell {
      background: rgba(30, 41, 59, .95);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid transparent;
      position: relative;
      height: var(--cell);
      transition: transform .15s, border-color .15s
    }

    .cell:hover {
      transform: scale(1.1);
      border-color: var(--gold);
      z-index: 5
    }

    .cell.active {
      background: rgba(201, 162, 39, .22);
      border-color: var(--gold)
    }

    .cell .n {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: .5rem;
      opacity: .55
    }

    .cell .s {
      color: var(--teal);
      font-weight: 800;
      font-size: .95rem;
      margin-top: 6px
    }

    .detail {
      display: none;
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-top: 4px
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px
    }

    .detail .big {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--gold)
    }

    .detail .name {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 6px 0 16px
    }

    .info-l {
      color: var(--gold);
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px
    }

    .info-t {
      color: var(--muted);
      margin-bottom: 14px;
      font-size: .95rem
    }

    .photo-col {
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .el-img {
      width: 100%;
      max-width: 280px;
      border-radius: 12px;
      border: 2px solid rgba(201, 162, 39, .3);
      background: #1a1f29;
      min-height: 180px;
      object-fit: cover
    }

    .img-fallback {
      width: 100%;
      max-width: 280px;
      min-height: 180px;
      border-radius: 12px;
      border: 2px dashed rgba(201, 162, 39, .25);
      background: rgba(30, 41, 59, .6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dim);
      font-size: .9rem;
      text-align: center;
      padding: 16px
    }

    .photo-lbl {
      color: var(--gold);
      font-size: .8rem;
      font-weight: 700;
      margin-top: 10px;
      text-align: center
    }

    @media(max-width:720px) {
      :root {
        --cell: 34px;
        --gap: 2px
      }

      .detail-grid {
        grid-template-columns: 1fr
      }

      .photo-col {
        order: -1
      }

      .nav a {
        font-size: .75rem;
        padding: 7px 10px
      }

      .search button {
        width: 100%;
        max-width: 340px
      }
    }

    @media(max-width:400px) {
      :root {
        --cell: 28px
      }
    }

    #lang-switcher {
      display: none !important
    }
  </style>
</head>

      if (!d) { d = { name: sym + ' (#' + num + ')', w: '—', use: (window.i18n ? i18n.t('noData') : 'Маълумот нест.'), fact: '#' + num + ' · ' + sym, danger: '—' }; }
      document.getElementById('sel').style.display = 'flex';
      document.getElementById('selSym').textContent = sym;
      document.getElementById('selName').textContent = d.name.split('(')[0].trim();
      document.getElementById('selMeta').textContent = '#' + num + ' · M = ' + d.w;
      document.getElementById('dSym').textContent = sym;
      document.getElementById('dName').textContent = d.name.indexOf('(') >= 0 ? d.name : d.name + ' (' + sym + ')';
      document.getElementById('dUse').textContent = d.use;
      document.getElementById('dFact').textContent = d.fact;
      document.getElementById('dDanger').textContent = d.danger;
      document.getElementById('dWeight').textContent = d.w;
      document.getElementById('detail').style.display = 'block';
      const img = document.getElementById('elImg');
      const fb = document.getElementById('imgFb');
      const src = IMG[sym] || null;
      if (src) { fb.style.display = 'none'; img.style.display = 'block'; img.src = src; img.alt = d.name; }
      else { img.style.display = 'none'; img.removeAttribute('src'); fb.style.display = 'flex'; }
      document.querySelectorAll('.cell').forEach(function (x) { x.classList.remove('active') });
      var ac = document.querySelector('.cell[data-n="' + num + '"]');
      if (ac) ac.classList.add('active');
    }
    function doSearch() {
      var v = document.getElementById('q').value.trim().toLowerCase();
      if (!v) return;
      if (!isNaN(v)) { var n = +v; if (n >= 1 && n <= 118) { sel(n); document.getElementById('q').value = ''; return; } }
      var u = v.toUpperCase(); var idx = SYM.indexOf(u);
      if (idx > 0) { sel(idx); document.getElementById('q').value = ''; return; }
      for (var j = 1; j <= 118; j++) {
        var d = DB[(SYM[j] || '').toLowerCase()];
        if (d && d.name.toLowerCase().indexOf(v) >= 0) { sel(j); document.getElementById('q').value = ''; return; }
        if (SYM[j] && SYM[j].toLowerCase() === v) { sel(j); document.getElementById('q').value = ''; return; }
        if (window.i18n && typeof i18n.getElementData === 'function') {
          var i18 = i18n.getElementData(SYM[j]);
          if (i18 && i18.name && i18.name.toLowerCase().indexOf(v) >= 0) { sel(j); document.getElementById('q').value = ''; return; }
        }
      }
      alert(window.i18n ? i18n.t('notFound') : 'Элемент ёфт нашуд');
    }
    document.getElementById('q').addEventListener('keypress', function (e) { if (e.key === 'Enter') doSearch(); });
    document.addEventListener('languageChanged', function () { if (currentNum) sel(currentNum); });
    setTimeout(function () { sel(1); }, 200);
  </script>
  <script src="js/elements-i18n.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    (function () {
      function wireLangBar() {
        var bar = document.getElementById('langBar');
        if (!bar || !window.i18n) return;
        bar.querySelectorAll('button[data-lang]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            i18n.setLanguage(btn.getAttribute('data-lang'));
          });
        });
        try {
          var lang = localStorage.getItem('siteLang') || 'tg';
          bar.querySelectorAll('button[data-lang]').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-lang') === lang);
          });
        } catch (e) { }
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wireLangBar);
      else wireLangBar();
      setTimeout(wireLangBar, 50);
    })();
  </script>
  <script src="js/site-runtime.js"></script>
