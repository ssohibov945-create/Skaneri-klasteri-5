<!DOCTYPE html>
<html lang="tj">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Тести биология барои ММТ — 40 савол">
    <title>Тестҳои биология | SCANNERI</title>
    <link rel="stylesheet" href="biology.css">
</head>

<body>
    <nav class="site-nav" aria-label="Навигатсия">
        <a class="brand" href="index.html"><span class="brand-mark">S</span> SCANNERI</a>
        <div class="nav-links"><a href="../index.html">Асосӣ</a><a href="../ximiya/photo.html">Химия</a><a
                class="active" href="index.html">Биология</a><a href="#">Физика</a><a href="#">Тоҷикӣ</a></div>
    </nav>
    <main class="page-shell test-shell">
        <header class="section-heading">
            <p class="eyebrow">БИОЛОГИЯ · САНҶИШ</p>
            <h1>Тести биология</h1>
            <p>40 савол · 20 дақиқа · як ҷавоби дуруст</p>
        </header>
        <section id="testArea">
            <div class="test-meta"><span class="progress-text" id="progressText">Савол 1 аз 40</span><span class="timer"
                    id="timer">20:00</span></div>
            <article class="question-panel">
                <p class="question-number" id="questionNumber">Саволи 1</p>
                <h2 class="question-text" id="questionText">Савол бор мешавад...</h2>
                <div class="options" id="optionsContainer"></div>
            </article>
            <div class="test-actions"><button class="primary-button" id="nextButton" type="button">Саволи навбатӣ
                    →</button></div>
            <p class="test-message" id="testMessage" role="status" aria-live="polite"></p>
        </section>
        <section class="result-panel hidden" id="resultPanel" aria-live="polite">
            <p class="eyebrow">НАТИҶА</p>
            <h2>Тест ба анҷом расид</h2>
            <span class="result-score" id="scoreValue">0 / 40</span>
            <p class="result-detail" id="percentValue">0%</p>
            <button class="primary-button" id="restartButton" type="button">Бори дигар</button>
        </section>
        <a class="back-link" href="index.html">← Ба саҳифаи биология</a>
    </main>
    <script src="tests.js"></script>
</body>

</html>
